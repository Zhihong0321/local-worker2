<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e24;
      color: #f1f2f6;
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-card {
      background: #2a2a32;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .row:last-child {
      margin-bottom: 0;
    }
    .label {
      color: #a4b0be;
    }
    .val {
      font-weight: 600;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
    }
    .pill-green {
      background: rgba(39, 174, 96, 0.2);
      color: #2ecc71;
    }
    .pill-red {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
    }
    .pill-yellow {
      background: rgba(243, 156, 18, 0.2);
      color: #f39c12;
    }
    button {
      width: 100%;
      background: #3498db;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <h2><span>⚡</span> Local Worker Bridge</h2>
  <div class="status-card">
    <div class="row">
      <span class="label">Local Bridge:</span>
      <span id="bridge-status" class="pill pill-red">Checking...</span>
    </div>
    <div class="row">
      <span class="label">ChatGPT Tab:</span>
      <span id="tab-status" class="pill pill-red">Checking...</span>
    </div>
    <div class="row">
      <span class="label">Worker Port:</span>
      <span class="val">8765</span>
    </div>
  </div>
  <button id="btn-open-chatgpt">Open ChatGPT Tab</button>
  <button id="btn-test-prompt" style="margin-top: 8px; background: #27ae60;">⚡ Test Prompt on ChatGPT</button>
  <div id="test-result" style="margin-top: 8px; font-size: 11px; color: #a4b0be; word-break: break-all;"></div>
  <script src="popup.js"></script>
</body>
</html>
